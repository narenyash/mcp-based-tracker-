# TeamTrack edge config (included inside nginx's http {} block, as /etc/nginx/conf.d/default.conf).
#  - Serves the Vite build: hashed /assets/* cached for a year, index.html / other files always revalidated.
#  - Proxies /api and /socket.io to the API on the same origin (the refresh cookie is SameSite=strict).
#  - /healthz, /readyz and /metrics are NOT proxied: probe the API container directly from inside the network.
# ${API_UPSTREAM} is filled in at container start by the nginx image's envsubst step (default server:4000).
# TLS: terminate at your load balancer / ingress, or add a `listen 443 ssl` server here. Either way set the
# API's TRUST_PROXY to the number of proxies in front of it (1 = just this nginx).

upstream teamtrack_api {
    server ${API_UPSTREAM};
    keepalive 32;
}

# WebSocket upgrade for Socket.io; plain requests keep the upstream connection alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Some URLs carry credentials (invite tokens, signed file links); log them masked.
map $request_uri $teamtrack_log_uri {
    ~^/api/v1/invites/[^/?]+/preview  /api/v1/invites/[redacted]/preview;
    ~^/api/v1/files/                  /api/v1/files/[redacted];
    ~^/invite/                        /invite/[redacted];
    default                           $request_uri;
}

# Correlates nginx and API logs: the API adopts this id (X-Request-Id) for its own logs and responses.
log_format teamtrack '$remote_addr - [$time_local] "$request_method $teamtrack_log_uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent" rid=$request_id';

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Largest API upload is 10 MiB (attachments, MAX_ATTACHMENT_BYTES); keep this a little above it.
    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/problem+json
               image/svg+xml application/manifest+json font/ttf application/wasm;

    access_log /var/log/nginx/access.log teamtrack;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API
    location /api/ {
        proxy_pass http://teamtrack_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Security headers come from the API (helmet); nothing is added here, so nothing is duplicated.
    }

    # ---- live updates (Socket.io: long-polling handshake, then WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://teamtrack_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        # Socket.io pings every 25s; anything above that keeps idle sockets open.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- static: content-hashed bundles never change, so cache them forever.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- SPA: unknown paths fall back to index.html (client-side routing); always revalidated so a
    # deploy is picked up on the next navigation. add_header here is not inherited by the locations above.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # img-src: signed S3 download URLs. font-src esm.sh: Excalidraw's default font CDN (drop it if the
        # fonts are self-hosted via EXCALIDRAW_ASSET_PATH). style 'unsafe-inline': React/Excalidraw inline styles.
        # connect-src 'self' covers same-origin ws:/wss: (CSP Level 3) for Socket.io.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amazonaws.com; font-src 'self' data: https://esm.sh; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
